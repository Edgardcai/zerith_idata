<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZERITH · 采集工作台</title><link rel="stylesheet" href="/static/style.css?v=20260916.2"></head>
<body>
<header><a class="brand" href="/"><span class="brand-icon">Z</span>采集工作台</a><div class="header-status"><span id="connection" class="pill">连接中</span><span id="battery" class="battery">电量 —</span></div><div class="header-actions"><button id="check" class="secondary">设备检测</button><button id="end" class="secondary" disabled>结束会话</button><button id="start" class="primary">启动采集</button></div></header>
<main>
<div id="alert" class="alert" hidden role="alert"></div>
<section class="card scene-panel" aria-label="采集场景">
<div class="scene-controls"><label>日期<input id="taskId" type="number" min="0" max="99999999" step="1" placeholder="YYYYMMDD"></label><label>场景<input id="sceneId" type="number" min="1" max="99999999" step="1" value="1"></label><button id="applyScene" class="primary" type="button">应用</button><span id="sceneHint" class="muted" role="status">待应用</span></div>
<div class="directory"><span id="directoryLabel">目录</span><code id="directory">请先应用场景</code><button id="copyPath" class="text-button" disabled>复制</button></div>
</section>
<section class="overview"><div class="phase-summary"><h1 id="phase">准备采集</h1><p id="phaseHint"></p></div><div class="metrics"><div><span>已保存</span><strong id="episodeCount">0</strong></div><div><span>阶段</span><strong id="stage">—</strong></div><div><span>时长</span><strong id="elapsed">00:00</strong></div></div></section>
<div id="checks" class="checks" aria-label="设备检查"></div>
<div class="workspace">
<section class="card task-card"><div class="card-title"><h2>采集任务</h2><span id="sessionLabel" class="muted"></span></div>
<form id="taskForm"><label>提示词<textarea id="prompt" rows="2" maxlength="500" spellcheck="false"></textarea></label>
<div class="targets"><label>左手目标<input id="left" placeholder="自动识别"></label><label>右手目标<input id="right" placeholder="自动识别"></label></div>
<section class="stage-config" aria-label="分阶段采集"><div class="stage-config-heading"><label>阶段数<input id="subtasks" type="number" min="1" max="20" step="1" value="2" aria-describedby="stageHint"></label><label class="history-toggle"><input id="recordDepth" type="checkbox" disabled>深度图</label><details id="taskOptions"><summary>更多参数</summary><div class="parameters"><label>频率 · Hz<input id="frequency" type="number" min="1" max="60" value="30"></label><label>最长时长 · 秒<input id="maxTime" type="number" min="1" max="1200" value="1000"></label><label>高度标签 · m<input id="liftHeight" type="number" min="0" step="any" placeholder="可选" title="记录于每条数据"></label></div></details></div><ol id="stagePlan" class="stage-plan"></ol><p id="stageHint" class="stage-hint" role="status">长按 Y 开始 · 短按 Y 切换阶段 / 保存</p></section>
</form></section>
<aside class="device-column">
<section class="card teleop-panel" aria-label="遥操与固定高度"><div class="teleop-heading"><h2 id="teleopState" role="status" aria-live="polite">等待遥操状态</h2><button id="teleopVoice" class="text-button" type="button">语音提示</button></div><div id="teleopWarning" class="teleop-warning" hidden role="status"></div><div class="lift-controls"><label class="lift-switch"><input id="fixedLift" type="checkbox">固定升降柱</label><label class="lift-value"><input id="fixedLiftHeight" aria-label="固定升降柱高度，米" type="number" min="0" max="0.8" step="0.01" value="0.4">m</label><button id="saveTeleop" class="secondary" type="button">保存</button></div><span id="liftApplied" class="muted"></span></section>
<details class="card telemetry"><summary>实时关节<span id="vrStatus">等待 VR</span></summary><div id="joints" class="joints"></div></details>
<section class="card camera-card"><div class="card-title"><h2>相机</h2><span id="cameraHint" class="muted"></span><button id="cameraToggle" class="text-button">打开预览</button></div><div id="cameraGrid" class="camera-grid" hidden><figure><figcaption>左腕</figcaption><img data-camera="left" alt="左腕实时画面"><span data-camera-state="left">等待画面</span></figure><figure><figcaption>头部</figcaption><img data-camera="head" alt="头部实时画面"><span data-camera-state="head">等待画面</span></figure><figure><figcaption>右腕</figcaption><img data-camera="right" alt="右腕实时画面"><span data-camera-state="right">等待画面</span></figure></div></section>
</aside></div>
<section class="card episodes-card"><div class="card-title"><h2>采集记录</h2><span id="gradeCounts" class="muted"></span><span class="grade-note">默认 A · 点击修改</span></div><div id="episodes" class="dataset-groups"></div><div id="empty" class="empty">暂无采集记录</div></section>
<details class="diagnostics"><summary>诊断详情</summary><pre id="diagnostics"></pre></details>
</main>
<div id="toast" class="toast" hidden role="status"></div>
<dialog id="confirm"><form method="dialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button id="confirmAccept" value="ok" class="primary">确认</button></div></form></dialog>
<dialog id="review"><div class="card-title"><h2 id="reviewTitle">查看数据</h2><button id="closeReview" class="secondary">关闭</button></div>
<div class="review-toolbar"><button id="reviewPlay" class="primary" disabled>三路播放</button><button id="reviewPause" class="secondary">暂停</button><input id="reviewSeek" type="range" min="0" max="0" step="0.01" value="0" aria-label="三路视频进度" disabled><span id="reviewTime">00:00 / 00:00</span><label>倍速 <select id="reviewSpeed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><button id="reviewRetry" class="secondary">重新加载</button></div>
<p id="reviewStatus" class="review-status" role="status" aria-live="polite"></p><div id="reviewGrid" class="review-grid"></div></dialog>
<script src="/static/review.js" defer></script>
<script src="/static/app.js?v=20260916.2" defer></script>
</body></html>
