<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商超全流程质检</title><link rel="stylesheet" href="/market/style.css?v=1"><script src="/market/app.js?v=1" defer></script></head><body>
<header><div><a href="/">← 质检工作台</a><h1>商超全流程质检</h1><p>导航 → 抓取 → 运送 → 递交 · 跨目录、跨端口统一处理</p></div><span class="pill">人工评级优先</span></header>
<section class="toolbar"><label class="path">数据根目录<input id="root" list="roots"><datalist id="roots"></datalist></label><button id="scan">读取数据</button><button id="qc" class="primary">增量质检全部</button><label><input type="checkbox" id="force">重新检查全部</label></section>
<section class="exportbar"><strong>合并 LeRobot</strong><label><input type="checkbox" id="grade-a" checked>A</label><label><input type="checkbox" id="grade-b" checked>B</label><label><input type="checkbox" id="manual-only">仅整体已人工评级</label><button id="export">将当前根目录合并导出</button><button id="download">下载质检报告</button><small id="output"></small><p>按采用等级筛选；原始 episode 保留，统一编号到一个数据集，不按模型端口或等级拆目录。未完成质检、硬失败和阶段不完整的记录会列出排除原因。</p></section>
<div id="notice" role="status"></div><section class="jobs"><strong>后台任务</strong><span id="job-status">暂无任务</span><progress id="progress" max="1" value="0"></progress><button id="cancel" hidden>停止任务</button><details id="job-details"><summary>任务详情 / 排除原因</summary><pre id="job-json"></pre></details></section>
<div class="workspace"><aside><div class="filters"><input id="search" placeholder="搜索路径 / 模型地址 / 订单"><select id="filter"><option value="all">全部记录</option><option value="pending">未完成质检</option><option value="manual">未整体人工质检</option><option value="phase-manual">各阶段待人工复核</option><option value="A">采用 A</option><option value="B">采用 B</option><option value="F">采用 F</option></select><span id="count"></span></div><div id="records"></div></aside><main><div id="empty">选择一条记录查看各阶段结果和视频</div><article id="detail" hidden><h2 id="title"></h2><p id="source"></p><div id="grades" class="gradebar"></div><div class="review"><strong>整体人工评级</strong><select id="overall-grade"><option>A</option><option>B</option><option>F</option></select><input id="overall-note" placeholder="整体备注（可选）"><button id="save-overall">保存整体评级</button></div>
<p class="hint">自动结果检查数据与动作记录；掉落、碰撞、真实抓稳与交接仍需看视频确认。整体人工评级优先，各阶段均人工复核后可汇总为采用等级。</p>
<div class="playbar"><button id="play">播放 / 暂停</button><select id="speed"><option value="1">1 倍速</option><option value="2" selected>2 倍速</option><option value="4">4 倍速</option></select><input id="seek" type="range" value="0" min="0" max="1" step="0.05"><span id="clock">0:00</span></div>
<div class="videos"><div><label>头部</label><video id="cam_high" muted playsinline controls></video><small id="status-cam_high"></small></div><div><label>左腕</label><video id="cam_left_wrist" muted playsinline controls></video><small id="status-cam_left_wrist"></small></div><div><label>右腕</label><video id="cam_right_wrist" muted playsinline controls></video><small id="status-cam_right_wrist"></small></div></div>
<div id="phases"></div><details open><summary>整条记录的基础检查</summary><div id="checks"></div></details></article></main></div></body></html>
