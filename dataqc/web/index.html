<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>plumo筛查</title><link rel="stylesheet" href="/auto/assets/style.css?v=6"><link rel="stylesheet" href="/auto/assets/raw-grade.css?v=4"></head><body>
<aside><a class="brand" href="/">plumo筛查<span>零次方</span></a><nav><a href="/auto/hdf5" data-page="home">HDF5</a></nav><a class="settings-nav" href="/auto/settings" data-page="settings">设置</a></aside>
<main><header><div><h1 id="title">数据处理</h1><p id="subtitle">选择一组数据，统一质检与导出</p></div><span class="service" id="service">连接中</span></header>
<section id="new-run" class="panel"><form id="start-form"><label class="grow">数据集<select name="root" id="root" required><option value="">正在读取数据集…</option></select></label><button id="refresh-sources" type="button">刷新目录</button><label>处理方式<select name="mode" id="mode"><option value="auto">自动处理</option><option value="manual">手动复核</option></select></label><label style="display:flex;align-items:center;gap:8px"><input id="run-vlm-enabled" type="checkbox" style="width:auto">类别识别（YOLO + Terra）</label><button id="start-button" class="primary" type="submit" disabled>处理整组数据</button></form><p class="note" id="source-summary">正在读取数据目录…</p></section>
<div id="content"></div><div id="library-content" hidden></div><div id="compare-content" hidden></div>
</main><div id="toast" role="status"></div>
<dialog id="episode-dialog"><div class="dialog-head"><div><h2 id="episode-title"></h2><small id="episode-source"></small></div><button id="close-dialog" aria-label="关闭">关闭</button></div><div class="review-grid"><section class="media-panel"><div id="raw-replay-nav" hidden><div id="raw-review-filter"></div><div class="raw-nav-controls"><button id="raw-prev" type="button">上一条</button><select id="raw-nav-select" aria-label="回放记录"></select><button id="raw-next" type="button">下一条</button></div></div><div id="raw-grade-bar" hidden></div><div class="playback-context"><p id="current-task"></p><b id="current-stage"></b><p id="video-error" class="error-text"></p></div><div class="videos"><figure class="head-video"><video id="v0" muted controls preload="metadata"></video><figcaption>头部相机</figcaption></figure><figure><video id="v1" muted controls preload="metadata"></video><figcaption>左腕相机</figcaption></figure><figure><video id="v2" muted controls preload="metadata"></video><figcaption>右腕相机</figcaption></figure></div><div class="play-controls"><button id="prev-frame">上一帧</button><button id="play">同步播放</button><button id="next-frame">下一帧</button><select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option selected value="1">1×</option><option value="2">2×</option></select><span id="frame-label"></span></div><input id="seek" type="range" min="0" value="0"><div class="curve-toolbar"><label>部位<select id="joint-group"><option value="grippers">夹爪</option><option value="left">左臂</option><option value="right">右臂</option><option value="lift">升降柱</option><option value="waist">腰部</option><option value="head">头部</option><option value="base">底盘</option><option value="all">全部关节</option></select></label><label>曲线<select id="curve-source"><option value="both">State 与 Action</option><option value="state">State 反馈</option><option value="action">Action 指令</option></select></label><label>起始帧<input id="curve-start" type="number" min="0" value="0"></label><label>结束帧<input id="curve-end" type="number" min="1"></label><button id="curve-reset" type="button">完整轨迹</button></div><div class="legend"><span class="left">蓝线：State</span><span class="right">橙线：Action</span></div><div id="chart"></div><details id="frame-values"><summary>当前帧全部字段与数值</summary><div id="values-table"></div><details><summary>文件属性</summary><pre id="source-fields"></pre></details></details><div id="report-tabs"><button data-tab="raw">原始质检报告</button><button data-tab="repaired">修复后报告</button><button data-tab="visual">VLM 质检 / 类别识别</button></div><div id="report-content"></div></section><section class="edit-panel"><h3 id="edit-title">分级与标注</h3><form id="lr-review" hidden><label>等级<select id="lr-grade"><option>A</option><option>B</option><option>F</option></select></label><label class="check"><input id="lr-excluded" type="checkbox">从复筛副本中排除</label><label>操作人<input id="lr-actor" required></label><label>原因<textarea id="lr-reason" required rows="4"></textarea></label><button type="submit" class="primary">保存复筛</button><p class="note">F 自动排除。返回 LeRobot 页面可生成复筛副本。</p></form><p id="suggestion" class="note"></p><form id="review-form"><div class="form-row"><label>等级<select id="grade"><option value="A">A · 高质量</option><option value="B">B · 有瑕疵可用</option><option value="F">F · 错误数据</option></select></label><label>操作人<input id="actor" required placeholder="姓名"></label></div><label>提示词<textarea id="prompt" rows="3" required></textarea></label><h4>左右手阶段 <small>原始帧，结束帧不包含在内</small></h4><div id="stage-edit"></div><button type="button" id="set-boundary">将当前帧设为左右手切换点</button><h4>静止帧剔除 <small>默认保留两端共 40 帧</small></h4><div id="trim-edit"></div><label>分级／修改理由<textarea id="reason" rows="3" required></textarea></label><p class="note">A：符合任务且通过复检；B：有训练价值的轻微瑕疵；F：确认错误。原始等级仅供参考。</p><button type="submit" class="primary wide">保存标注</button><button type="button" id="save-continue" class="wide">保存并继续转换</button></form><div id="episode-error"></div></section></div></dialog>
<script src="/auto/assets/app.js?v=batch1"></script><link rel="stylesheet" href="/auto/assets/qc-report.css?v=1"><script src="/auto/assets/qc-report.js?v=1"></script><script src="/auto/assets/raw-grade.js?v=5"></script><script src="/auto/assets/raw-review-filter.js?v=1"></script><script src="/auto/assets/viewer.js?v=review3"></script><script src="/auto/assets/library.js?v=6"></script></body></html>
