      <section class="action-card hdf5-actions" aria-labelledby="hdf5ActionsTitle">
        <h3 id="hdf5ActionsTitle">HDF5 数据处理</h3>
        <div class="actions">
          <button id="optimizeHdf5Btn" class="primary" data-stage="optimize_hdf5">HDF5 质检</button>
          <button data-stage="repair">剔除静止帧</button>
          <button class="danger" data-stage="delete">选择 episode 删除</button>
          <button id="replayBtn">HDF5 数据可视化回放</button>
        </div>
        <div id="stationaryThresholdControl" class="stationary-threshold-control hidden">
          <label for="stationaryThreshold">静止帧上限</label>
          <select id="stationaryThreshold"><option value="20">20 帧</option><option value="40" selected>40 帧</option><option value="60">60 帧</option></select>
        </div>
      </section>
      <section class="action-card lerobot-actions" aria-labelledby="lerobotActionsTitle">
        <h3 id="lerobotActionsTitle">LeRobot 转换</h3>
        <div class="actions">
          <button class="primary" data-stage="lerobot">按等级生成 LeRobot</button>
          <div id="lerobotStageSplitControl" class="lerobot-stage-split-control hidden">
            <button id="splitLerobotStagesBtn" data-stage="split_lerobot_stages" disabled>按左右手阶段切分</button>
            <span id="lerobotStageSplitReason" hidden></span><span id="lerobotStageSplitPaths" hidden></span>
          </div>
        </div>
      </section>
      <div class="job-controls"><button id="stopJobBtn" class="danger" type="button">停止当前任务</button></div>
