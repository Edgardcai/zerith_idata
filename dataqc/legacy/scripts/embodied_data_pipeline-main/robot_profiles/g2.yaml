# AgiBot G2 — single source of truth for state/action layout, cameras, QC.
# Consumed by:
#   - quality_pipeline.profiles.load_profile (adapter / IR / validators / writers)
#   - tools/run_quality_pipeline.py
#   - agibot_web (recording schema sanity-check, optional)
# DO NOT duplicate this file. New robot ⇒ new file alongside this one.

schema_version: 1
profile_id: agibot_g2
display_name: AgiBot G2

# pipeline-side: which adapter parses this robot's raw episodes
adapter: g2
lerobot_robot_type: agibot_g2
control_backend: agibot_gdk_ros2

tasks:
  default: "grasp the bottle"

fps:
  record: 20
  action: 30

# raw episode layout on disk (what agibot_web/_record_loop writes)
raw:
  episode_glob: "episode_*"
  state_file: state.csv
  meta_file: meta.json
  images_dir: images
  actions_file: actions.jsonl
  action_fallback: state_to_action

cameras:
  - raw_key: head_color
    lerobot_key: observation.images.head_color
    role: head
    required: true
  - raw_key: hand_left_color
    lerobot_key: observation.images.hand_left_color
    role: left_wrist
    required: true
  - raw_key: hand_right_color
    lerobot_key: observation.images.hand_right_color
    role: right_wrist
    required: true

state:
  feature: observation.state
  dim: 26
  layout:
    - name: left_arm
      slice: [0, 7]
      unit: rad
      joint_names:
        - idx21_arm_l_joint1
        - idx22_arm_l_joint2
        - idx23_arm_l_joint3
        - idx24_arm_l_joint4
        - idx25_arm_l_joint5
        - idx26_arm_l_joint6
        - idx27_arm_l_joint7
    - name: left_gripper
      index: 7
      unit: model_rad
      open: 0.0
      closed: -0.91
    - name: right_arm
      slice: [8, 15]
      unit: rad
      joint_names:
        - idx61_arm_r_joint1
        - idx62_arm_r_joint2
        - idx63_arm_r_joint3
        - idx64_arm_r_joint4
        - idx65_arm_r_joint5
        - idx66_arm_r_joint6
        - idx67_arm_r_joint7
    - name: right_gripper
      index: 15
      unit: model_rad
      open: 0.0
      closed: -0.91
    - name: waist
      slice: [16, 21]
      unit: rad
      joint_names:
        - idx01_body_joint1
        - idx02_body_joint2
        - idx03_body_joint3
        - idx04_body_joint4
        - idx05_body_joint5
    - name: base_position_xyz
      slice: [21, 24]
      unit: m
      source: slam_odom
    - name: base_orientation_zw
      slice: [24, 26]
      unit: quat_component
      source: slam_odom

action:
  feature: action
  dim: 24
  representation: absolute_joint_targets_plus_base_velocity
  layout:
    - name: left_arm
      slice: [0, 7]
      unit: rad
      command: joint_position
    - name: left_gripper
      index: 7
      unit: model_rad
      open: 0.0
      closed: -0.91
      command: gripper_position
    - name: right_arm
      slice: [8, 15]
      unit: rad
      command: joint_position
    - name: right_gripper
      index: 15
      unit: model_rad
      open: 0.0
      closed: -0.91
      command: gripper_position
    - name: waist
      slice: [16, 21]
      unit: rad
      command: joint_position
    - name: base_velocity
      slice: [21, 24]
      unit: [m/s, m/s, rad/s]
      components: [vx, vy, wz]
      command: chassis_velocity

# coarse recording-time invariants. agibot_web may check these post-episode.
quality_checks:
  state_dim: 26
  action_dim: 24
  required_cameras: [head_color, hand_left_color, hand_right_color]
  timestamp_monotonic: true
  finite_state_action: true

# validator thresholds (quality_pipeline/pipelines/validators/*)
validation:
  frame_consistency:
    max_missing_camera_ratio: 0.02
  action_jump:
    arm_state_slices: [[0, 7], [8, 15]]
    arm_action_slices: [[0, 7], [8, 15]]
    waist_state_slice: [16, 21]
    waist_action_slice: [16, 21]
    max_arm_delta: 1.05
    max_waist_delta: 0.65
  gripper:
    model_min: -0.91
    model_max: 0.0

# RTML/CoRobot-inspired QC + annotation thresholds (quality_pipeline/qc.py + rtml.py)
processing:
  rtml:
    quality:
      accept_score: 70.0
    global_constraints:
      max_timestamp_gap_sec: 0.25
      min_fps: 29.0
      min_duration_sec: 2.0
      max_missing_camera_ratio: 0.02
      max_state_step: 1.5
      max_joint_step: 0.8
      min_joint_motion_mean: 0.0001
      gripper_delta_threshold: 0.02
      action_stationary_epsilon: 0.000001
      stationary_state_epsilon: 0.05
      stationary_base_velocity_epsilon: 0.0001
      max_stationary_action_frames: 15
  segmentation:
    gripper_delta_threshold: 0.02
    min_segment_frames: 10
    stationary_min_frames: 12       # paper §IV-B(2) "stationary state" boundary signal
  frame_annotations:
    window: 5
    vel_slow_thresh: 0.02
    vel_fast_thresh: 0.15
    acc_thresh: 0.02
  annotations:
    vision_pipeline:
      enabled: false               # set true to enrich trajectory.objects with bbox
      detector: local_yolo         # local_yolo | mock
      weights: models/wbc_yolo26l_seg_640x400_20260522_1516_boxmap5095_0.862_maskmap5095_0.751.pt
      # YOLO requires image size to be divisible by max stride 32.
      # Raw/recorded frames may be 640x400; detector pads/resizes to 640x416.
      imgsz: [640, 416]
      conf_threshold: 0.45
      key_frames: [first, last]    # only 2 frames per episode
      camera: head_color           # which camera to run detection on
      timeout_sec: 10
    object_flexibility_default: rigid
    hand_target_assignment:
      # VLM samples frames after each gripper-close segment, when the object is
      # more likely to be visible in the wrist camera. The matching wrist camera
      # is the primary view; head_color is kept as scene context.
      cameras: [head_color]
      wrist_cameras:
        left: hand_left_color
        right: hand_right_color
      sample_frame: post_grasp
      post_grasp_frame_offset: 10
      max_events_per_hand: 1
    vlm:
      # VLM for scene_description (L1 trajectory annotation, paper §IV-B(1) step 2).
      # Uses OpenAI-compatible API — works with AIHubMix, OpenAI, Azure, etc.
      enabled: false
      base_url: https://aihubmix.com/v1
      model: qwen3-vl-flash            # fast + vision + cheap; alternatives:
                                        #   gpt-4o-mini, claude-3-5-haiku, gemini-2.0-flash
      api_key_env: AIHUBMIX_API_KEY    # export AIHUBMIX_API_KEY=sk-xxx before running
      max_tokens: 256
      language: zh                     # zh | en
      timeout_sec: 30
      scene_layout:
        auto_infer: true
        shelf:
          physical_levels: 5
          drink_rows: 3

# ---------------------------------------------------------------------------
# YOLO class index → canonical English name
# Source: weights file class names (Chinese) extracted 2026-05-26.
# Add new classes here when retraining. Never hard-code in Python code.
# ---------------------------------------------------------------------------
yolo_class_alias:
  0:  "ENONE Sparkling Water"
  1:  "7UP"
  2:  "Coca-Cola"
  3:  "Weichuan Daily C Orange"
  4:  "Minute Maid Juice"
  5:  "Schweppes Vitamin C"
  6:  "Mirinda Grape"
  7:  "Itoen Oolong Tea"
  8:  "Pepsi"
  9:  "Huayang Soda"
  10: "Coconut Water"
  11: "JDB Herbal Tea"
  12: "Mirinda Peach"
  13: "Weichuan Daily C Grape"
  14: "Mirinda Orange"
  15: "Aojiru"
  16: "Tropicana"
  17: "Mirinda Green Apple"
  18: "ENONE Juice"
  19: "Frozen Pear Drink"

# Normalize variant names back to preset-level names.
# e.g. "Mirinda Grape" / "Mirinda Orange" both match the preset target "Mirinda".
yolo_class_normalize:
  "Itoen Oolong Tea":    "Itoen Barley Tea"
  "Mirinda Grape":       "Mirinda"
  "Mirinda Orange":      "Mirinda"
  "Mirinda Peach":       "Mirinda"
  "Mirinda Green Apple": "Mirinda"
  "Weichuan Daily C Orange": "Weichuan Daily C"
  "Weichuan Daily C Grape":  "Weichuan Daily C"

# ---------------------------------------------------------------------------
# Task presets: define what each task scenario expects.
# key       = task_preset_id stored in episode meta.json (or matched from prompt)
# kind      = simple (1 target/arm) | medium (2 targets/arms)
# targets   = ordered list per subtask-index; order = hand order (0→left, 1→right)
# ---------------------------------------------------------------------------
task_presets:
  "22er":
    kind: simple
    collaboration: low
    targets:
      "0": ["ENONE Juice"]
      "1": ["Itoen Oolong Tea"]
      "2": ["ENONE Sparkling Water"]
      "3": ["7UP"]
      "4": ["Mirinda"]
      "5": ["Coconut Water"]
      "6": ["Coca-Cola"]
      "7": ["Minute Maid Juice"]
      "8": ["Tropicana"]
      "9": ["Pepsi"]
  "22et":
    kind: medium
    collaboration: high
    targets:
      "0": ["Huayang Soda", "ENONE Sparkling Water"]
      "1": ["Aojiru", "JDB Herbal Tea"]
      "2": ["Huayang Soda", "Frozen Pear Drink"]
      "3": ["Schweppes Vitamin C", "Schweppes Vitamin C"]
      "4": ["Tropicana", "7UP"]
      "5": ["Coca-Cola", "Weichuan Daily C"]
      "6": ["Coca-Cola", "Tropicana"]
      "7": ["Frozen Pear Drink", "Weichuan Daily C"]
      "8": ["ENONE Juice", "Frozen Pear Drink"]
      "9": ["Pepsi", "Mirinda"]

notes:
  - "Matches agibot_web/pi05_core.py and agibot_web/README.md as of 2026-05."
  - "G2 gripper action/state use MODEL domain: 0=open, -0.91=closed."
  - "State base slice stores pose; action base slice stores velocity."
